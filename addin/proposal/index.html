<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>提案ナレッジ</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<link rel="stylesheet" href="style.css">
<script src="roi-core.js"></script>
</head>
<body>

<header id="app-header">
  <div class="hdr-left">
    <span class="hdr-title">提案ナレッジ</span>
    <span id="demo-badge" class="demo-badge" style="display:none">DEMO</span>
  </div>
  <div class="hdr-right">
    <button id="settings-btn" class="icon-btn" title="設定">⚙</button>
    <button id="reload-btn" class="icon-btn" title="再読み込み">⟳</button>
  </div>
</header>

<nav id="tab-nav">
  <button class="tab-btn active" data-tab="hearing">① 議事録入力</button>
  <button class="tab-btn" data-tab="proposal">② 提案</button>
  <button class="tab-btn" data-tab="prompt">③ プロンプト出力</button>
</nav>

<main id="app-main">

  <!-- ====== ① 議事録入力 ====== -->
  <section id="pane-hearing" class="pane active">

    <div class="field-row">
      <label>案件ID</label>
      <input id="case-id" list="case-id-list" placeholder="例: KM-01">
      <datalist id="case-id-list"></datalist>
    </div>
    <div class="field-row">
      <label>課題カテゴリ</label>
      <select id="category-select"></select>
    </div>

    <div class="field-row">
      <label>発言者</label>
      <select id="speaker-select">
        <option value="顧客">顧客</option>
        <option value="自社">自社</option>
      </select>
    </div>
    <div class="field-row">
      <label>参照URL</label>
      <input id="hearing-url" placeholder="議事録ビューア等へのリンク（任意）">
    </div>
    <div class="field-row col">
      <label>発言・メモ</label>
      <textarea id="hearing-text" rows="5" placeholder="議事録の文字起こし、または要点メモを貼り付け（URLのみでも可）"></textarea>
    </div>

    <div class="btn-row">
      <button id="save-log-btn" class="btn">発言を議事録に記録</button>
      <button id="extract-btn" class="btn btn-accent">AIで抽出してROI試算に反映</button>
    </div>

    <div id="extract-status" class="status-line"></div>

    <div id="extract-review" class="review-list" style="display:none">
      <div class="review-title">抽出結果（保存前に確認・修正できます）</div>
      <div id="extract-items"></div>
      <div class="btn-row">
        <button id="apply-extract-btn" class="btn btn-accent">ROI試算シートに保存</button>
        <button id="cancel-extract-btn" class="btn">取消</button>
      </div>
    </div>

    <div class="section-title">この案件の議事録ログ</div>
    <div id="hearing-log-list" class="log-list"></div>
  </section>

  <!-- ====== ② 提案 ====== -->
  <section id="pane-proposal" class="pane">
    <div class="field-row">
      <label>案件ID</label>
      <input id="case-id-2" list="case-id-list" placeholder="例: KM-01">
    </div>
    <button id="load-proposal-btn" class="btn">この案件の課題を表示</button>

    <div id="proposal-list"></div>

    <div id="proposal-summary" class="summary-bar" style="display:none">
      <span id="proposal-summary-text"></span>
    </div>
  </section>

  <!-- ====== ③ プロンプト出力 ====== -->
  <section id="pane-prompt" class="pane">
    <div class="field-row">
      <label>案件ID</label>
      <input id="case-id-3" list="case-id-list" placeholder="例: KM-01">
    </div>
    <button id="build-prompt-btn" class="btn">選択済みの課題からプロンプトを組み立て</button>

    <div id="prompt-output"></div>
  </section>

</main>

<!-- ====== 設定パネル ====== -->
<div id="settings-modal" class="modal-overlay" style="display:none">
  <div class="modal-box">
    <div class="modal-title">設定</div>
    <div class="field-row col">
      <label>AI連携エンドポイント（GAS WebアプリURLなど）</label>
      <input id="cfg-webhook" placeholder="https://script.google.com/macros/s/.../exec">
    </div>
    <div class="field-row col">
      <label>簡易トークン（任意）</label>
      <input id="cfg-token" placeholder="サーバ側で照合する共有トークン">
    </div>
    <p class="hint">APIキーはここには保存されません。エンドポイント側（GAS等）でのみ保持してください。</p>
    <div class="btn-row">
      <button id="cfg-save-btn" class="btn btn-accent">保存</button>
      <button id="cfg-close-btn" class="btn">閉じる</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
