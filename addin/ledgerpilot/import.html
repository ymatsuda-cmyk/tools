<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LedgerPilot 仕訳取込</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ledgerpilot.css?v=rev_20260930_lp001">
<style>
  .wrap { max-width: 1080px; margin: 0 auto; padding: 20px 16px 40px; }
  header.app { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
  header.app h1 { font-size: 20px; margin: 0; letter-spacing: .02em; }
  header.app h1 span { color: var(--accent); }
  .step { display: grid; grid-template-columns: 28px 1fr; gap: 10px; }
  .step .no { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: #fff;
    display: grid; place-items: center; font-weight: 700; font-size: 12px; }
  .step.off .no { background: var(--rule); color: var(--ink-3); }
  .files { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 640px) { .files { grid-template-columns: 1fr; } }
  .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  #version { font-size: 11px; color: var(--ink-3); }
</style>
</head>
<body>
<div class="wrap">
  <header class="app">
    <h1>Ledger<span>Pilot</span> 仕訳取込</h1>
    <span id="version"></span>
  </header>

  <section class="lp-panel step">
    <div class="no">1</div>
    <div>
      <h2 style="margin:0 0 8px;font-size:14px">台帳とCSVを選ぶ</h2>
      <div class="files">
        <label class="lp-drop" id="drop-book">
          <input type="file" id="file-book" accept=".xlsx">
          <b>仕訳台帳（.xlsx）</b><br><span id="book-name">初回は選ばずに進めると新しい台帳を作ります</span>
        </label>
        <label class="lp-drop" id="drop-csv">
          <input type="file" id="file-csv" accept=".csv,.txt">
          <b>弥生会計の仕訳日記帳CSV</b><br><span id="csv-name">ここにドロップ、またはクリックして選択</span>
        </label>
      </div>
      <div id="load-msg"></div>
    </div>
  </section>

  <section class="lp-panel step off" id="step2">
    <div class="no">2</div>
    <div>
      <h2 style="margin:0 0 8px;font-size:14px">差し替える期間を確認する</h2>
      <p class="muted" style="margin:0 0 8px">この期間に入る台帳の仕訳は、CSVの内容で置き換わります。期間外の仕訳はそのまま残ります。</p>
      <label class="lp-field">開始日<input type="date" id="p-start"></label>
      <label class="lp-field">終了日<input type="date" id="p-end"></label>
      <button class="lp-btn" id="btn-diff">差分を確認</button>
      <div id="csv-info" class="muted" style="margin-top:6px"></div>
    </div>
  </section>

  <section class="lp-panel step off" id="step3">
    <div class="no">3</div>
    <div>
      <h2 style="margin:0 0 8px;font-size:14px">差分を見て差し替える月を選ぶ <small>行をクリックすると伝票の内訳を表示</small></h2>
      <div id="diff"></div>
      <div class="actions">
        <button class="lp-btn primary" id="btn-apply" disabled>選択した月を差し替えて保存</button>
        <span id="apply-msg" class="muted"></span>
      </div>
    </div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="ledger-core.js?v=rev_20260930_lp001"></script>
<script src="ledger-diffview.js?v=rev_20260930_lp001"></script>
<script src="import.js?v=rev_20260930_lp001"></script>
</body>
</html>
