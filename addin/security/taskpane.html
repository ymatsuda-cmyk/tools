<style id="css">
:root{

}

  --bg:#12151B;--surface:#1B2029;--ink:#E8EBF0;--sub:#A9B1BF;--line:#2E3542;--line2:#262C37;

  --accent:#7FB0EC;--accent-weak:#1E2C40;--on-accent:#0B1626;
  --ok:#5B93D6;--ok-weak:#21324A;--ng:#E07A47;--ng-weak:#3A2519;--ng-ink:#F0A57E;--na:#6B7484;--none:#2A303B;
  --mid-weak:#352C14;--mid-ink:#E3C46F;--low-weak:#262C37;--low-ink:#C3CAD5;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#12151B;--surface:#1B2029;--ink:#E8EBF0;--sub:#A9B1BF;--line:#2E3542;--line2:#262C37;
  --bar:#0B0E13;--bar-ink:#FFFFFF;--bar-sub:#A9B1BF;--bar-2:#232A36;
  --accent:#7FB0EC;--accent-weak:#1E2C40;--on-accent:#0B1626;

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'BIZ UDPGothic','Hiragino Sans','Yu Gothic','Meiryo',sans-serif;font-size:15px;line-height:1.7}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--bar-ink);padding:10px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.brand{font-weight:700;font-size:18px}
.tabs{display:flex;gap:4px;background:var(--bar-2);border-radius:8px;padding:4px;flex-wrap:wrap}
.tabs button{min-height:38px;padding:0 16px;border:none;border-radius:6px;background:transparent;color:var(--bar-sub);cursor:pointer}
.tabs button[aria-selected="true"]{background:#FFFFFF;color:#161B26;font-weight:700}
.status{margin-left:auto;font-size:13px;color:var(--bar-sub)}
.wrap{max-width:1320px;margin:0 auto;padding:20px 24px 48px}
.btn{min-height:44px;padding:0 16px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.ghost{background:transparent;border:1px dashed var(--na);color:var(--sub)}
.btn.small{min-height:34px;padding:0 12px;font-size:13px}
.btn.danger{color:var(--ng-ink);border-color:var(--ng)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 22px}
.panel h2{margin:0 0 10px;font-size:16px}
.row{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.side{flex:1 1 230px;max-width:290px;display:flex;flex-direction:column;gap:2px}
.side .cap{font-size:12px;font-weight:700;color:var(--sub);padding:0 12px 6px}
.side button.item{display:flex;justify-content:space-between;gap:8px;text-align:left;min-height:44px;padding:8px 12px;border:none;border-radius:6px;background:transparent;cursor:pointer}
.side button.item[aria-current="true"]{background:var(--surface);box-shadow:0 0 0 1px var(--line);color:var(--accent);font-weight:700}
.side .n{color:var(--sub);font-variant-numeric:tabular-nums}
.main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:16px}
.pills{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{font-size:12px;padding:2px 10px;border-radius:999px;background:var(--low-weak);color:var(--low-ink)}
.pill.high{background:var(--ng-weak);color:var(--ng-ink);font-weight:700}
.pill.mid{background:var(--mid-weak);color:var(--mid-ink);font-weight:700}
.h1{margin:4px 0 6px;font-size:26px;line-height:1.35}
.lead{margin:0;color:var(--sub);max-width:70ch}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:900px){.grid3,.grid2{grid-template-columns:minmax(0,1fr)}}
ul.plain,ol.plain{margin:0;padding-left:1.25em;display:flex;flex-direction:column;gap:6px}
.mtype{font-size:12px;font-weight:700;color:var(--accent);margin-top:6px}
.mtype:first-child{margin-top:0}
.meta{font-size:13px;color:var(--sub)}
.hist div{font-size:14px}
.hist .d{color:var(--sub);margin-right:10px;font-variant-numeric:tabular-nums}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:0 12px;min-height:44px;flex:1 1 240px;max-width:380px}
.search input{border:none;background:transparent;outline:none;flex:1;min-width:0}
mark{background:var(--mid-weak);color:inherit}
/* inspect */
.targetbar{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center}
.field{display:flex;flex-direction:column;gap:4px}
.field>span{font-size:12px;font-weight:700;color:var(--sub)}
.field select,.field input,.field textarea{min-height:44px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.field textarea{resize:vertical;line-height:1.6}
.switch{display:flex;align-items:center;gap:8px;min-height:44px;cursor:pointer}
.switch input{width:20px;height:20px}
.prog{flex:2 1 340px;display:flex;flex-direction:column;gap:6px}
.stack{height:12px;background:var(--none);border-radius:999px;overflow:hidden;display:flex}
.stack span{display:block;height:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--sub)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.acc{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.acchead{display:flex;align-items:center;padding-right:16px;flex-wrap:wrap}
.acchead>button{flex:1 1 300px;min-width:0;min-height:56px;display:flex;align-items:center;gap:12px;padding:0 20px;border:none;background:transparent;text-align:left;cursor:pointer;color:inherit}
.acchead>button .t{flex:1;font-weight:700;font-size:16px}
.acchead>button .c{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.acchead .scope{border-left:1px solid var(--line2);padding-left:14px;font-size:14px}
.acc.off .t{color:var(--sub)}
.h-off{background:transparent;color:var(--sub);border:1px dashed var(--na)!important}
.judge{padding:14px 20px;border-top:1px solid var(--line2);background:var(--accent-weak);display:flex;flex-direction:column;gap:10px}
.judge .jt{font-weight:700;font-size:14px}
.jq{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}

.jq .seg{flex:0 0 180px}
.jr{font-size:14px}
.chk{padding:16px 20px;display:flex;flex-wrap:wrap;gap:14px 24px;border-top:1px solid var(--line2)}
.chk .q{flex:2 1 380px;display:flex;flex-direction:column;gap:2px}
.chk .q b{font-size:15px}
.chk .a{flex:1 1 280px;display:flex;flex-direction:column;gap:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;min-height:42px;border:none;background:var(--surface);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on-ok{background:var(--ok);color:#FFFFFF;font-weight:700}
.seg button.on-ng{background:var(--ng);color:#FFFFFF;font-weight:700}
.seg button.on-na{background:var(--na);color:#FFFFFF;font-weight:700}
.memo{min-height:38px;padding:4px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);width:100%}
.empty{padding:28px;text-align:center;color:var(--sub)}
/* viz */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}

.kpi .v{font-size:32px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--sub)}
.kpi.warn .v{color:var(--ng-ink)}
.bars{display:flex;flex-direction:column;gap:10px}
.bars .r{display:grid;grid-template-columns:200px minmax(0,1fr) 70px;gap:12px;align-items:center;font-size:14px}
@media (max-width:700px){.bars .r{grid-template-columns:minmax(0,1fr)}}
.bars .p{font-size:13px;color:var(--sub);text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
table.heat{border-collapse:separate;border-spacing:3px;font-size:13px;min-width:100%}
table.heat th{font-weight:700;text-align:left;padding:6px 8px;white-space:nowrap}

table.heat td button{width:100%;min-height:34px;border:none;border-radius:4px;cursor:pointer;font-variant-numeric:tabular-nums}
.h-none{background:var(--none);color:var(--sub)}
.h-part{background:var(--ok-weak);color:var(--ink)}
.h-done{background:var(--ok);color:#FFFFFF}
.h-ng{background:var(--ng);color:#FFFFFF;font-weight:700}
table.list{width:100%;border-collapse:collapse;font-size:14px}
table.list th{text-align:left;background:var(--low-weak);padding:8px 10px}

.tlist{display:flex;flex-direction:column}
.tlist .tr{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line2)}
.tlist .tr .nm{flex:1 1 200px}

dialog{border:none;border-radius:12px;padding:0;width:min(880px,calc(100vw - 24px));max-height:calc(100vh - 40px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,14,20,.55)}
.dlg{padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.dlg h2{margin:0;font-size:20px}
.dlg .g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:700px){.dlg .g3{grid-template-columns:minmax(0,1fr)}}
.ckrow{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.ckrow input{flex:1 1 300px;min-height:40px;padding:4px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.ckrow select{min-height:40px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0 8px}
.dlgfoot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line2);padding-top:14px}
.hint{font-size:12px;color:var(--sub)}
@media print{.top,.no-print{display:none!important}body{background:#fff}}

#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;max-width:calc(100vw - 24px);background:var(--bar);color:var(--bar-ink);padding:10px 16px;border-radius:8px;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.3)}
#toast.err{background:#9A3A0E;color:#FFFFFF}

#cdlg{width:min(420px,calc(100vw - 24px))}
.stline{font-size:13px;color:var(--sub);margin:0}
@media (max-width:700px){
  body{font-size:14px}
  .top{padding:8px 12px;gap:8px 12px}
  .brand{font-size:16px}
  .tabs{width:100%}
  .tabs button{flex:1;padding:0 6px;min-height:40px}
  .status{margin-left:0;width:100%;font-size:12px}
  .wrap{padding:12px 12px 40px}
  .panel{padding:14px}
  .h1{font-size:22px}
  .side{max-width:none;flex:1 1 100%;flex-direction:row;flex-wrap:wrap;gap:6px}
  .side .cap{width:100%;padding:0 2px 2px}

  .side button.item[aria-current="true"]{border-color:var(--accent)}
  .main{flex:1 1 100%}
  .kpi .v{font-size:26px}
  .chk{padding:12px 14px}
  .acchead .scope{border-left:none;padding-left:20px;flex:1 1 100%;min-height:40px}
  .acchead>button{padding:0 14px}
}
.lacc>button{width:100%;min-height:52px;display:flex;align-items:center;gap:12px;padding:0 20px;border:none;background:transparent;text-align:left;cursor:pointer;color:inherit}
.lacc>button .t{flex:1;font-weight:700;font-size:16px}
.lacc>button .c{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.laccbody{padding:12px 20px 18px;border-top:1px solid var(--line2)}
.casebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.caseframe{display:block;width:100%;height:560px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
</style>

/* ---------- Excel: 共通 ---------- */
function xlStep(label,p){
  return p.catch(function(e){
    var loc=e&&e.debugInfo&&e.debugInfo.errorLocation?'（'+e.debugInfo.errorLocation+'）':'';
    throw new Error(label+'でエラー：'+(e&&e.message?e.message:String(e))+loc);
  });
}
function xlQueue(fn){var p=XL.chain.then(fn);XL.chain=p.catch(function(){});return p}
function warnTail(){return XL.warn.length?' ※一部の書式は適用できませんでした：'+XL.warn.join('、'):''}

/* ---------- Excel: データの保存・読み込み（非表示シート _data） ---------- */
function xlLoad(){
  return Excel.run(function(ctx){
    var ws=ctx.workbook.worksheets.getItemOrNullObject(DATA_SHEET);
    return xlStep('保存先シートの確認',ctx.sync()).then(function(){
      if(ws.isNullObject)return null;
      var rg=ws.getRange('A1:A'+DATA_ROWS);rg.load('values');
      return xlStep('保存データの読み込み',ctx.sync()).then(function(){
        var txt=rg.values.map(function(r){
          var v=r[0]==null?'':String(r[0]);
          return v.indexOf(DATA_PREFIX)===0?v.slice(DATA_PREFIX.length):v;
        }).join('');
        if(!txt.trim())return null;
        try{return JSON.parse(txt)}catch(e){throw new Error('保存データが壊れています。「今すぐExcelに保存」で上書きするか、JSONバックアップから戻してください')}
      });
    });
  });
}
function xlWriteData(){
  var json=JSON.stringify(S),rows=[];
  for(var i=0;i<json.length;i+=DATA_CHUNK)rows.push([DATA_PREFIX+json.slice(i,i+DATA_CHUNK)]);
  if(rows.length>DATA_ROWS)return Promise.reject(new Error('データが大きすぎて保存できません'));
  return Excel.run(function(ctx){
    var wss=ctx.workbook.worksheets,ws=wss.getItemOrNullObject(DATA_SHEET),created=false;
    return xlStep('保存先シートの確認',ctx.sync()).then(function(){
      if(ws.isNullObject){ws=wss.add(DATA_SHEET);created=true}
      else ws.getRange('A1:A'+DATA_ROWS).clear(Excel.ClearApplyTo.contents);
      return xlStep('保存先シートの準備',ctx.sync());
    }).then(function(){
      var rg=ws.getRangeByIndexes(0,0,rows.length,1);
      rg.numberFormat=rows.map(function(){return ['@']});
      rg.values=rows;
      return xlStep('データの書き込み',ctx.sync());
    }).then(function(){
      if(!created)return;
      ws.visibility=Excel.SheetVisibility.hidden;
      return ctx.sync().catch(function(){});
    });
  });
}
function xlSave(){
  saveState='Excelに保存中…';paintStatus();
  return xlQueue(xlWriteData).then(function(){
    saveState='Excelに保存しました（'+hhmm()+'）';paintStatus();
  }).catch(function(err){
    saveState='Excelに保存できませんでした：'+(err&&err.message?err.message:err);paintStatus();notify(saveState,true);
  });
}
function xlReports(activate){
  saveState='Excelの表を更新中…';paintStatus();
  return xlQueue(function(){return xlWriteReports(activate)}).then(function(){
    XL.reportAt=hhmm();XL.dirty=false;
    saveState='Excelの表を更新しました（'+hhmm()+'）'+warnTail();paintStatus();
  }).catch(function(err){
    saveState='Excelの表を更新できませんでした：'+(err&&err.message?err.message:err);paintStatus();notify(saveState,true);
  });
}

/* ---------- Excel: 見やすい表（「漏洩_」シート。アドインが作り直す一方向の出力） ---------- */
/* 値の書き込みは必ず行い、書式は1つずつ別に実行する。書式が失敗してもデータは残り、警告として表示する。 */
function xdeco(label,fn){XL.deco.push({label:label,fn:fn})}
function xrunDeco(ctx){
  var p=Promise.resolve();
  XL.deco.forEach(function(d){
    p=p.then(function(){
      try{d.fn()}catch(e){XL.warn.push(d.label);return}
      return ctx.sync().catch(function(e){XL.warn.push(d.label+(e&&e.code?'['+e.code+']':''))});
    });
  });
  return p;
}
function xgrid(ws,rows,r0,c0){
  var rg=ws.getRangeByIndexes(r0||0,c0||0,rows.length,rows[0].length);
  rg.numberFormat=rows.map(function(r){return r.map(function(){return '@'})});
  rg.values=rows;
  return rg;
}
function xhead(rg){rg.format.fill.color=XC.head;rg.format.font.color=XC.white;rg.format.font.bold=true}
function xtable(ws,rows,name,label){
  var rg=xgrid(ws,rows,0,0);
  xhead(ws.getRangeByIndexes(0,0,1,rows[0].length));
  xdeco('表（'+label+'）',function(){if(rows.length>1){var t=ws.tables.add(rg,true);t.name=name;t.style='TableStyleLight9'}});
  xdeco('見出し行の固定（'+label+'）',function(){ws.freezePanes.freezeRows(1)});
  return rg;
}
function xwidths(ws,label,list){xdeco('列幅（'+label+'）',function(){list.forEach(function(w,i){ws.getRangeByIndexes(0,i,1,1).getEntireColumn().format.columnWidth=w})})}
function xwrap(label,rg){xdeco('折り返し（'+label+'）',function(){rg.format.wrapText=true;rg.format.verticalAlignment='Top'})}
function xcf(label,rg,defs){
  xdeco('色分け（'+label+'）',function(){
    defs.forEach(function(d){
      var cf=rg.conditionalFormats.add(Excel.ConditionalFormatType.containsText);
      cf.textComparison.format.fill.color=d[1];
      if(d[2])cf.textComparison.format.font.color=d[2];
      cf.textComparison.rule={operator:Excel.ConditionalTextOperator.contains,text:d[0]};
    });
  });
}
var JLAB={'in':'点検対象',out:'対象外',pending:'判定待ち'};
var RLAB={ok:'OK',ng:'要対応',na:'対象外'};
var OUT_LABEL='対象外（起因）';

function rpTargets(ws){

function rpJudge(ws){

      var j=JLAB[judge(t.name,c.id).s],qs=c.scopeQs||[];
      if(qs.length)qs.forEach(function(q){rows.push([t.name,c.name,q.text,a[q.id]==='y'?'はい':a[q.id]==='n'?'いいえ':'',j])});
      else rows.push([t.name,c.name,'（設問なし）この起因を点検するか',offR(t.name,c.id)!==null?'いいえ':'はい',j]);

function rpResults(ws){
  var L='点検結果';

function rpNg(ws){
  var L='要対応';

function rpSummary(ws){
  var L='サマリ';
  var T=inTargets(),all=allChecks(),o=stat(T,all),done=0;
  T.forEach(function(t){if(stat([t],all).none===0)done++});
  var pct=o.total?Math.round((o.total-o.none)/o.total*100):0;
  xgrid(ws,[['情報漏洩対策集 サマリ'],['作成日時：'+new Date().toLocaleString('ja-JP')+'　※「漏洩_」シートはアドインが作り直します。編集しても反映されません。']],0,0);
  xgrid(ws,[['点検対象の取引先',T.length+' / '+S.targets.length+' 社'],['点検実施率',pct+'%（完了 '+done+' 社）'],['要対応の項目',String(o.ng)],['未点検の項目',String(o.none)]],3,0);
  var r0=8;
  var rows=[['起因','OK','要対応','対象外','未点検']].concat(S.causes.map(function(c){var a=stat(T,c.checks);return [c.name,a.ok,a.ng,a.na,a.none]}));
  ws.getRangeByIndexes(r0,0,rows.length,1).numberFormat=rows.map(function(){return ['@']});
  var cr=ws.getRangeByIndexes(r0,0,rows.length,5);
  cr.values=rows;
  xhead(ws.getRangeByIndexes(r0,0,1,5));
  var m0=r0+rows.length+3;
  xgrid(ws,[['取引先 × 起因（セルは 点検済み／項目数、要対応があれば「要 n」）']],m0,0);
  var head=['取引先'].concat(S.causes.map(function(c){return c.name}),['要対応計']);
  var mrows=[head],fills=[];
  T.forEach(function(t){
    var row=[t.name],fr=[null],tot=0;
    S.causes.forEach(function(c){
      var j=judge(t.name,c.id).s,s=stat([t],c.checks),d=s.total-s.none;tot+=s.ng;
      if(j==='pending'){row.push('判定待ち');fr.push([XC.none,XC.sub])}
      else if(j==='out'){row.push('対象外');fr.push(['#FFFFFF',XC.sub])}
      else if(s.ng){row.push('要 '+s.ng);fr.push([XC.ng,XC.white])}
      else if(d===0){row.push('0/'+s.total);fr.push([XC.none,XC.sub])}
      else if(d===s.total){row.push(d+'/'+s.total);fr.push([XC.ok,XC.white])}
      else{row.push(d+'/'+s.total);fr.push([XC.okWeak,'#161B26'])}
    });
    row.push(tot?String(tot):'');fr.push(null);
    mrows.push(row);fills.push(fr);
  });
  if(mrows.length===1)mrows.push(['点検対象の取引先がありません'].concat(head.slice(1).map(function(){return ''})));
  xgrid(ws,mrows,m0+1,0);
  xhead(ws.getRangeByIndexes(m0+1,0,1,head.length));
  xdeco('書式（'+L+'）',function(){
    var t=ws.getRange('A1');t.format.font.size=16;t.format.font.bold=true;
    ws.getRange('A2').format.font.color=XC.sub;
    ws.getRange('A4:A7').format.font.bold=true;
    ws.getRange('B6').format.font.color=XC.ngInk;ws.getRange('B6').format.font.bold=true;
    ws.getRange('A'+(m0+1)).format.font.bold=true;
    ws.getRangeByIndexes(m0+1,1,1,head.length-1).format.wrapText=true;
    ws.getRangeByIndexes(m0+2,1,mrows.length-1,head.length-1).format.horizontalAlignment='Center';
  });
  xwidths(ws,L,[180].concat(S.causes.map(function(){return 86}),[70]));
  xdeco('マトリクスの色分け',function(){
    fills.forEach(function(fr,i){fr.forEach(function(f,j){if(!f)return;var cell=ws.getCell(m0+2+i,j);cell.format.fill.color=f[0];cell.format.font.color=f[1]})});
  });
  if(rows.length>1)xdeco('グラフ',function(){
    var ch=ws.charts.add(Excel.ChartType.barStacked,cr,Excel.ChartSeriesBy.columns);
    ch.title.text='起因別の点検状況（点検対象の全取引先）';
    ch.setPosition('G2','O'+(r0+rows.length+2));
    [XC.ok,XC.ng,XC.na,XC.none].forEach(function(color,i){ch.series.getItemAt(i).format.fill.setSolidColor(color)});
  });
}
function xlWriteReports(activate){
  XL.warn=[];XL.deco=[];
  return Excel.run(function(ctx){
    var wss=ctx.workbook.worksheets,tmp=null,ws={};
    wss.load('items/name');

      var names=wss.items.map(function(x){return x.name});
      tmp=wss.add('_tmp'+(Date.now()%1000000));

      drop.forEach(function(n){wss.getItem(n).visibility=Excel.SheetVisibility.visible});

      });
    }).then(function(){
      RP_ORDER.forEach(function(n){ws[n]=wss.add(n)});

    }).then(function(){
      var jobs=[[RP.measures,rpMeasures],[RP.targets,rpTargets],[RP.judge,rpJudge],[RP.results,rpResults],[RP.ng,rpNg],[RP.summary,rpSummary]];
      var p=Promise.resolve();

    });
  });
}

function stat(targets,checks){
  var o={ok:0,ng:0,na:0,none:0,total:0};
  var cm=ckMap();targets.forEach(function(t){checks.forEach(function(k){var r=res(t.name,k.id);o.total++;if(offR(t.name,cm[k.id])!==null)o.na++;else if(!r||!r.s)o.none++;else o[r.s]++})});
  return o;
}

}

var CASE_SHEET='漏洩事例',CASE_LS='leak-cases-v1',FEED_URL='cases-feed.json';
var CASE_CATS=[['ext','外部からの不正アクセス'],['chain','委託先・クラウド経由'],['ransom','ランサムウェア・マルウェア'],['acct','メール・アカウント乗っ取り'],['human','誤送信・設定ミス・人的'],['other','改ざん・その他']];
var CASE_COLS=[['ID','id'],['公表日','pub'],['基準日','base'],['日付の種別','baseType'],['企業・団体','co'],['サービス・システム','svc'],['件数','n'],['件数の表記','nt'],['原因タイプ','cat'],['重要度','imp'],['重要の理由','impWhy'],['一覧用の概要','summary'],['関連','rel'],['出典URL','url'],['取得元','src'],['取得日','got'],['詳細タイトル','title'],['詳細サブタイトル','sub'],['主な数字','facts'],['発生日（詳細）','sec_date'],['概要（詳細）','sec_summary'],['発覚の経緯','sec_discovery'],['リスク・影響範囲','sec_risk'],['原因','sec_cause'],['対処（暫定・恒久）','sec_response'],['導入業者としての対策','sec_vendor'],['出典一覧','sources'],['整理方法','method'],['記事本文','body']];

/* ---------- サイトの本文から、広告・案内・画像クレジット・目次・空の見出しを除く（保存済みの本文も整える） ---------- */
var BUILD='2026-10-20 r8';
var NOISE=[
  /^[\s*＊\-–—■□●・→←>＞»›|｜]+$/,
  /メルマガ登録|無料メルマガ|メルマガ会員登録/,
  /無料会員登録|会員登録はこちら/,
  /詳細はこちら|お申し込みはこちら|お申込みはこちら|資料請求はこちら|資料請求する|まとめて資料請求|お問い合わせはこちら|無料ダウンロード/,
  /セキュリティ対策無料相談窓口|無料相談はこちら/,
  /プレゼント[！!]/,
  /情シス部門の方必見/,
  /セキュリティ対策の基礎知識/,
  /セキュリティ対策で何をして良いかわからない/,
  /^(画像|写真|イラスト|図)[:：]/,
  /^(運営サービス|ユーザー様向け情報|ベンダー様向け情報|おすすめサービス|その他お知らせ|運営会社関連サービス|SNSでもご購読できます。?)$/,
  /^(関連コラム|関連記事)/,
  /→\s*$/
];
function cleanBody(text){
  var lines=String(text==null?'':text).split(/\r?\n/),out=[];
  function noisy(t){return NOISE.some(function(r){return r.test(t)})}
  for(var k=0;k<lines.length;k++){
    var t=lines[k].trim();
    if(!t)continue;
    if(/^(この記事の|このページの)?目次$/.test(t)){while(k+1<lines.length&&lines[k+1].trim()&&/^\s*(\d+[\.．)）]|[・*\-])\s*\S/.test(lines[k+1]))k++;continue}
    var hd=t.match(/^■\s*(.*)$/);
    if(hd){var h=hd[1].trim();if(!h||noisy(h))continue;out.push('■ '+h);continue}
    if(noisy(t))continue;
    out.push(t);
  }
  return out.filter(function(l,i){return !(/^■ /.test(l)&&(i===out.length-1||/^■ /.test(out[i+1])))}).join('\n');
}
function casesCleanBodies(){var n=0;CASES.forEach(function(c){if(c.body){var b=cleanBody(c.body);if(b!==c.body){c.body=b;n++}}});return n}

function catLabel(code){for(var i=0;i<CASE_CATS.length;i++)if(CASE_CATS[i][0]===code)return CASE_CATS[i][1];return CASE_CATS[5][1]}
function catCode(label){label=String(label==null?'':label).trim();for(var i=0;i<CASE_CATS.length;i++)if(CASE_CATS[i][1]===label||CASE_CATS[i][0]===label)return CASE_CATS[i][0];return 'other'}
var IMP_LAB={2:'最優先',1:'次点',0:''};
function impCode(v){v=String(v==null?'':v).trim();return (v==='最優先'||v==='2')?2:(v==='次点'||v==='1')?1:0}
function xlDate(v){
  if(typeof v==='number'&&v>20000)return new Date(Math.round((v-25569)*86400000)).toISOString().slice(0,10);
  var s=String(v==null?'':v).trim().replace(/\//g,'-');
  var m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  return m?m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2):s;
}
function h32(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)}
function caseToRow(c){return CASE_COLS.map(function(col){var k=col[1],v=c[k];if(k==='cat')return catLabel(v);if(k==='imp')return IMP_LAB[v]||'';return v==null?'':String(v).slice(0,32000)})}
function rowToCase(idx,row){
  var c={};
  CASE_COLS.forEach(function(col){
    var k=col[1],i=idx[col[0]],v=i==null?'':row[i];
    if(v==null)v='';
    if(k==='pub'||k==='base'||k==='got')v=xlDate(v);
    else if(k==='n')v=Number(String(v).replace(/,/g,''))||0;
    else if(k==='cat')v=catCode(v);
    else if(k==='imp')v=impCode(v);
    else v=String(v).trim();
    c[k]=v;
  });
  if(!c.base)c.base=c.pub;
  if(!c.baseType)c.baseType='公表';
  return c;
}
function parseCaseRows(values){
  if(!values||!values.length)return [];
  var idx={};values[0].forEach(function(h,i){idx[String(h==null?'':h).trim()]=i});
  if(idx['ID']==null&&idx['企業・団体']==null)throw new Error('「'+CASE_SHEET+'」シートの1行目の見出しが見つかりません（見出しは変更しないでください）');
  var seen={},out=[];
  values.slice(1).forEach(function(row,r){
    var c=rowToCase(idx,row);
    if(!c.id&&!c.co&&!c.summary&&!c.url&&!c.title&&!c.svc)return;
    if(!c.id)c.id=c.url?('u'+h32(c.url)):('m'+(r+2));
    var base=c.id,n=2;while(seen[c.id])c.id=base+'-'+(n++);
    seen[c.id]=1;out.push(c);
  });
  return out;
}

function normUrl(u){return String(u==null?'':u).trim().replace(/[#?].*$/,'').replace(/\/$/,'')}
function mergeCases(base,items){
  var byId={},byUrl={},added=0,filled=0,list=base.slice();
  base.forEach(function(c){byId[c.id]=c;if(c.url)byUrl[normUrl(c.url)]=c});
  (items||[]).forEach(function(it){
    if(!it||!it.id)return;
    var ex=byId[it.id]||(it.url?byUrl[normUrl(it.url)]:null);
    if(ex){
      var ch=false;
      if(isMetaOnly(ex)&&it.method==='AI'){['sec_summary','sources','method'].forEach(function(k){if(it[k])ex[k]=it[k]});ch=true}
      /* Excelで直した内容は上書きせず、空欄だけ補う */
      CASE_COLS.forEach(function(col){var k=col[1],cur=ex[k],empty=(cur==null||cur===''||cur===0);if(empty&&it[k]!=null&&it[k]!==''&&it[k]!==0){ex[k]=it[k];ch=true}});
      if(ch)filled++;
      return;
    }
    var n=JSON.parse(JSON.stringify(it));n.got=today();
    list.push(n);byId[n.id]=n;if(n.url)byUrl[normUrl(n.url)]=n;added++;
  });
  return {list:list,added:added,filled:filled};
}
/* ---------- 元記事の取得（GAS中継）：情報取得のときに、元記事から詳細（7項目）を整理する ---------- */
var GAS_LS='leak-gas-v1',GAS_SKIP_LS='leak-gas-skip-v1',GAS_INFO='';
var SEC_FIELDS=['sec_date','sec_summary','sec_discovery','sec_risk','sec_cause','sec_response','sec_vendor'];
function gasCfg(){try{var c=JSON.parse(localStorage.getItem(GAS_LS)||'null');return c&&c.url&&c.token?c:null}catch(e){return null}}
function gasSave(c){try{localStorage.setItem(GAS_LS,JSON.stringify(c));return true}catch(e){return false}}
function gasValidUrl(u){return /^https:\/\/script\.google\.com\/.+\/exec$/.test(String(u||'').trim())}
function gasSkipLoad(){try{return JSON.parse(localStorage.getItem(GAS_SKIP_LS)||'{}')||{}}catch(e){return {}}}
function gasMark(url){var m=gasSkipLoad();m[url]=Date.now();try{localStorage.setItem(GAS_SKIP_LS,JSON.stringify(m))}catch(e){}}
function gasCall(cfg,payload){
  payload.token=cfg.token;
  return fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),redirect:'follow',cache:'no-store'}).then(function(r){
    if(!r.ok)throw new Error('GASから応答がありません（HTTP '+r.status+'）');
    return r.text();
  },function(){
    throw new Error('GASに接続できません。URL（…/exec）と、公開設定（アクセスできるユーザー：全員）を確認してください');
  }).then(function(t){
    var j;try{j=JSON.parse(t)}catch(e){throw new Error('GASの応答を読み取れません。ウェブアプリのURLか、公開設定を確認してください')}
    if(!j.ok)throw new Error(j.error==='unauthorized'?'トークンが違います':(j.error||'GASでエラーが発生しました'));
    return j;
  });
}
function gasTargets(n){
  var skip=gasSkipLoad(),since=Date.now()-7*864e5;
  return CASES.filter(function(c){return c.url&&!c.title&&!(skip[c.url]&&skip[c.url]>since)})
    .sort(function(a,b){return String(b.pub).localeCompare(String(a.pub))}).slice(0,n||200);   /* n が 0 のときは全件（上限200） */
}
/* 機械が入れた「紹介文だけ」の行か（旧版が入れた途中で切れた紹介文も含む。手で書いた概要は含まない） */
function isMetaOnly(c){
  return !c.title&&!!(c.sec_summary||c.body)&&c.method!=='AI'&&(c.method==='紹介文'||c.method==='本文'||/^元記事\|/.test(c.sources||''))&&
    !['sec_date','sec_discovery','sec_risk','sec_cause','sec_response','sec_vendor'].some(function(k){return c[k]});
}
function applyEnrich(c,r){
  var ch=false;
  if(isMetaOnly(c)){   /* 機械が入れた紹介文・本文は、AIの整理や、より完全な本文で置き換える */
    if(r.method==='AI'){c.sec_summary=r.sec_summary||c.sec_summary;c.sources=r.sources||c.sources;c.method='AI';ch=true}
    else if(r.method==='本文'&&r.body&&(r.body!==c.body||c.sec_summary)){c.body=r.body;c.sec_summary='';c.method='本文';c.sources=r.sources||c.sources;ch=true}
  }
  ['co','svc','title','sub','nt','facts','sources','method','body'].concat(SEC_FIELDS).forEach(function(k){if(!c[k]&&r[k]){c[k]=r[k];ch=true}});
  if(!c.n&&r.n){c.n=r.n;ch=true}
  if((!c.cat||c.cat==='other')&&r.cat&&r.cat!=='other'){c.cat=r.cat;ch=true}
  if(/^\d{4}-\d{2}-\d{2}$/.test(r.base||'')&&(!c.base||c.base===c.pub)){c.base=r.base;if(r.baseType)c.baseType=r.baseType;ch=true}
  return ch;
}
/* 保存はしない（呼び出し側でまとめて保存する） */
function casesEnrichRun(){
  var cfg=gasCfg();if(!cfg)return Promise.resolve(null);
  var t=gasTargets(cfg.n===0?0:(cfg.n||5)),res={done:0,failed:0,meta:0,metaReason:'',none:!t.length,stop:'',total:t.length,err:'',canceled:false,remaining:0};
  var p=Promise.resolve();
  t.forEach(function(c,i){
    p=p.then(function(){
      if(res.stop||CS.cancel){res.canceled=!!CS.cancel;return}
      casesSetMsg('元記事の本文を取り込んでいます… '+(i+1)+' / '+t.length+'（途中でも「中止」できます）');
      return gasCall(cfg,{action:'article',url:c.url}).then(function(j){
        var r=j.result||{};
        if(applyEnrich(c,r)){res.done++;if(j.mode!=='ai'){res.meta++;res.metaReason=j.reason||j.warn||''}}else res.failed++;
        if(j.mode!=='ai'||!c.title)gasMark(c.url);   /* 紹介文だけだった記事は、しばらく再試行しない */
        if(res.done&&res.done%10===0)return casesSaveNow().catch(function(){});   /* 10件ごとに保存（途中で閉じても残る） */
      }).catch(function(e){
        res.failed++;res.err=e.message;gasMark(c.url);
        if(/トークン|接続できません|上限/.test(e.message))res.stop=e.message;
      });
    });
  });
  return p.then(function(){res.remaining=gasTargets(1000).length;return res});
}
function casesSetBusy(on){

function casesSaveNow(){return IN_EXCEL?xlQueue(function(){return xlWriteCases(CASES)}):Promise.resolve(casesSaveLocal())}
function casesEnrichMsg(en){
  if(!en)return '';

  var ai=en.done-en.meta;
  return '元記事から '+en.done+'件を取得（AIで整理 '+ai+'件'+(en.meta?'、サイトの本文のまま '+en.meta+'件［'+(en.metaReason||'AIを使えませんでした')+'］':'')+'）'+(en.failed?'。失敗 '+en.failed+'件'+(en.err?'：'+en.err:''):'')+(en.stop&&en.stop!==en.err?'。'+en.stop:'')+(en.canceled?'。中止しました':'')+(en.remaining?'。残り '+en.remaining+'件（もう一度押すと続きを取り込みます）':'');
}
function casesEnrich(){
  if(CS.busy)return Promise.resolve();
  if(!gasCfg()){notify('「データ管理」でGASのURLとトークンを設定してください',true);return Promise.resolve()}
  CS.busy=true;CS.cancel=false;casesSetBusy(true);casesSetMsg('元記事の本文を取り込んでいます…');
  var en=null,cleaned=0;
  return (IN_EXCEL?xlQueue(function(){return xlLoadCases()}):Promise.resolve(casesLoadLocal())).then(function(l){
    CASES=l||[];return casesEnrichRun();
  }).then(function(e){
    en=e;cleaned=casesCleanBodies();return (en&&en.done)||cleaned?casesSaveNow():null;
  }).then(function(){
    casesSetMsg(casesEnrichMsg(en)+(cleaned?'。保存済みの本文 '+cleaned+'件から、広告・案内などを除きました':'')+(IN_EXCEL?warnTail():''));postCases();
  }).catch(function(err){
    var m='整理できませんでした：'+(err&&err.message?err.message:err);casesSetMsg(m);notify(m,true);
  }).then(function(){CS.busy=false;casesSetBusy(false)});
}
function casesFetch(){
  if(CS.busy)return Promise.resolve();
  CS.busy=true;CS.cancel=false;casesSetBusy(true);casesSetMsg('情報を取得しています…');
  var cur=[],had=true,feed=null,feedErr='',r={added:0,filled:0},en=null,cleaned=0;
  return (IN_EXCEL?xlQueue(function(){return xlLoadCases()}):Promise.resolve(casesLoadLocal())).then(function(l){
    had=!!l;cur=l||[];CASES=cur;
    return fetchFeed().then(function(f){feed=f},function(e){feedErr=e&&e.message?e.message:String(e)});
  }).then(function(){
    if(!feed&&!gasCfg())throw new Error(feedErr);
    if(feed){r=mergeCases(cur,feed.items);CASES=r.list}
    return gasCfg()?casesEnrichRun():null;
  }).then(function(e){
    en=e;cleaned=casesCleanBodies();
    var need=r.added||r.filled||!had||(en&&en.done)||cleaned;
    return need?casesSaveNow():null;
  }).then(function(){
    var parts=[];
    if(feed){var when=feed.generatedAt?'（フィード更新 '+String(feed.generatedAt).replace('T',' ').slice(0,16)+'）':'';parts.push((r.added?'新規 '+r.added+'件を取り込みました':r.filled?'既存の '+r.filled+'件の空欄を補いました':'すでに最新です')+when)}
    else parts.push('フィードを取得できませんでした（'+feedErr+'）');
    if(en)parts.push(casesEnrichMsg(en));
    else{var stubs=CASES.filter(function(c){return c.url&&!c.title&&!c.body&&!c.sec_summary}).length;if(stubs)parts.push('本文が未取得の事例が '+stubs+'件あります。本文を取り込むには、「データ管理」でGASを設定してください')}
    if(cleaned)parts.push('保存済みの本文 '+cleaned+'件から、広告・案内などを除きました');
    casesSetMsg(parts.join('。')+(IN_EXCEL?warnTail():''));postCases();
  }).catch(function(err){
    var m='取得できませんでした：'+(err&&err.message?err.message:err);casesSetMsg(m);notify(m,true);
  }).then(function(){CS.busy=false;casesSetBusy(false)});
}

  function sel(name,val,opts){return '<select id="'+name+'">'+opts.map(function(o){return '<option'+(o===val?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>'}
  function ckRow(k){return '<div class="ckrow" data-ck="'+esc(k.id)+'"><input value="'+esc(k.text)+'" placeholder="点検する内容" aria-label="点検項目">'+
    '<select aria-label="頻度">'+S.freqs.map(function(f){return '<option'+(f===k.freq?' selected':'')+'>'+esc(f)+'</option>'}).join('')+'</select><button type="button" class="btn small" data-rm aria-label="この項目を削除">削除</button></div>'}
  dlg.innerHTML='<form class="dlg" method="dialog"><h2 id="dlgTitle">'+(isNew?'起因を追加':'「'+esc(c.name)+'」を編集')+'</h2>'+
    '<label class="field"><span>起因の名前</span><input id="e_name" required value="'+esc(c.name)+'"></label>'+
    '<div class="g3"><label class="field"><span>重要度</span>'+sel('e_sev',c.severity,['高','中','低'])+'</label><label class="field"><span>発生しやすさ</span>'+sel('e_lik',c.likelihood,['高','中','低'])+'</label><label class="field"><span>責任分界</span>'+sel('e_own',c.owner,['構築業者','顧客','構築業者＋顧客','委託先'])+'</label></div>'+
    '<label class="field"><span>概要</span><textarea id="e_sum" rows="2">'+esc(c.summary)+'</textarea></label>'+
    '<label class="field"><span>対象判定の設問（1行に1つ。どれかに「はい」と答えた取引先が点検対象。空欄なら手動で対象／対象外を切り替え）</span><textarea id="e_sq" rows="3">'+esc((c.scopeQs||[]).map(function(q){return q.text}).join('\n'))+'</textarea></label>'+
    '<label class="field"><span>原因（1行に1つ）</span><textarea id="e_rea" rows="3">'+esc(c.reasons.join('\n'))+'</textarea></label>'+
    '<div class="g3">'+MTYPES.map(function(t,i){return '<label class="field"><span>対策：'+t+'（1行に1つ）</span><textarea id="e_m'+i+'" rows="4">'+esc((c.measures[t]||[]).join('\n'))+'</textarea></label>'}).join('')+'</div>'+
    '<div class="field"><span>点検方法</span><div id="e_cks">'+c.checks.map(ckRow).join('')+'</div><button type="button" class="btn small" id="e_addck" style="align-self:flex-start">＋ 点検項目を追加</button><span class="hint">項目を削除すると、その項目の点検結果も消えます。</span></div>'+
    '<label class="field"><span>関連事例・参考資料（1行に1つ。「表示名 | URL」の形式、URLは省略可）</span><textarea id="e_refs" rows="3">'+esc(c.refs.map(function(r){return r.url?r.label+' | '+r.url:r.label}).join('\n'))+'</textarea></label>'+
    '<label class="field"><span>更新メモ（更新履歴に残ります）</span><input id="e_note" placeholder="'+(isNew?'新規作成':'例：IPA注意喚起を受けて点検項目を追加')+'"></label>'+
    '<div class="dlgfoot"><div>'+(isNew?'':'<button type="button" class="btn danger" id="e_del">この起因を削除</button>')+'</div><div style="display:flex;gap:8px"><button type="button" class="btn" id="e_cancel">キャンセル</button><button type="submit" class="btn primary">保存</button></div></div></form>';
  var cks=dlg.querySelector('#e_cks');
  dlg.querySelector('#e_addck').onclick=function(){var d=document.createElement('div');d.innerHTML=ckRow({id:c.id+'-'+Date.now().toString(36),text:'',freq:'四半期'});cks.appendChild(d.firstChild);cks.lastChild.querySelector('input').focus()};
  cks.addEventListener('click',function(e){if(e.target.closest('[data-rm]'))e.target.closest('.ckrow').remove()});
  dlg.querySelector('#e_cancel').onclick=function(){dlg.close()};
  if(!isNew)dlg.querySelector('#e_del').onclick=function(){
    askConfirm('「'+c.name+'」と、その点検結果を削除します。よろしいですか？',function(){
      S.causes=S.causes.filter(function(x){return x.id!==c.id});
      Object.keys(S.results).forEach(function(t){c.checks.forEach(function(k){delete S.results[t][k.id]})});
      Object.keys(S.off).forEach(function(t){delete S.off[t][c.id]});
      UI.cause=S.causes[0]&&S.causes[0].id;dlg.close();changed();render();
    });
  };
  dlg.querySelector('form').onsubmit=function(e){
    e.preventDefault();
    function lines(id){return dlg.querySelector(id).value.split('\n').map(function(s){return s.trim()}).filter(Boolean)}
    c.name=dlg.querySelector('#e_name').value.trim();if(!c.name){dlg.querySelector('#e_name').focus();return}
    c.severity=dlg.querySelector('#e_sev').value;c.likelihood=dlg.querySelector('#e_lik').value;c.owner=dlg.querySelector('#e_own').value;
    c.summary=dlg.querySelector('#e_sum').value.trim();c.reasons=lines('#e_rea');
    var oldQ=c.scopeQs||[];c.scopeQs=lines('#e_sq').map(function(tx,i){var f=oldQ.find(function(q){return q.text===tx});return f||{id:c.id+'-q'+Date.now().toString(36)+i,text:tx}});
    MTYPES.forEach(function(t,i){c.measures[t]=lines('#e_m'+i)});
    var before=c.checks.map(function(k){return k.id});
    c.checks=[].slice.call(cks.querySelectorAll('.ckrow')).map(function(r){return{id:r.getAttribute('data-ck'),text:r.querySelector('input').value.trim(),freq:r.querySelector('select').value}}).filter(function(k){return k.text});
    var kept=c.checks.map(function(k){return k.id});
    before.forEach(function(id){if(kept.indexOf(id)<0)Object.keys(S.results).forEach(function(t){delete S.results[t][id]})});
    c.refs=lines('#e_refs').map(function(l){var p=l.split('|');return{label:p[0].trim(),url:(p[1]||'').trim()}});
    c.history.push({date:today(),note:dlg.querySelector('#e_note').value.trim()||(isNew?'新規作成':'更新')});
    if(isNew)S.causes.push(c);else S.causes[S.causes.findIndex(function(x){return x.id===c.id})]=c;
    UI.cause=c.id;dlg.close();changed();render();
  };
  dlg.showModal();dlg.querySelector('#e_name').focus();
}

/* ---------- import / export ---------- */
function mergeImport(d){
  if(!d||!Array.isArray(d.causes)||!Array.isArray(d.targets))throw new Error('形式が違います');
  d.causes.forEach(function(c){var i=S.causes.findIndex(function(x){return x.id===c.id});if(i>=0)S.causes[i]=c;else S.causes.push(c)});
  d.targets.forEach(function(t){var x=S.targets.find(function(y){return y.name===t.name});if(x)x.inScope=t.inScope;else S.targets.push(t)});
  Object.keys(d.scopeA||{}).forEach(function(t){S.scopeA[t]=Object.assign(S.scopeA[t]||{},d.scopeA[t])});
  Object.keys(d.off||{}).forEach(function(t){S.off[t]=Object.assign(S.off[t]||{},d.off[t])});
  Object.keys(d.results||{}).forEach(function(t){S.results[t]=S.results[t]||{};Object.keys(d.results[t]).forEach(function(k){var a=S.results[t][k],b=d.results[t][k];if(!a||(b.d||'')>=(a.d||''))S.results[t][k]=b})});
}
function csv(){
  var rows=[['取引先','起因','点検項目','頻度','結果','メモ','点検日']];
  var L={ok:'OK',ng:'要対応',na:'対象外'};
  inTargets().forEach(function(t){S.causes.forEach(function(c){c.checks.forEach(function(k){var r=res(t.name,k.id)||{};var off=offR(t.name,c.id);rows.push([t.name,c.name,k.text,k.freq,off!==null?'対象外（起因）':(L[r.s]||'未点検'),off!==null?off:(r.m||''),off!==null?'':(r.d||'')])})})});
  return '\ufeff'+rows.map(function(r){return r.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"'}).join(',')}).join('\r\n');
}

/* ---------- events ---------- */
var root=document.getElementById('root');
root.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.getAttribute('data-act'),id=el.getAttribute('data-id');
  if(a==='tab'){UI.tab=id;render();window.scrollTo(0,0);if(id==='cases')casesReload(true)}
  else if(a==='cause'){UI.cause=id;render()}
  else if(a==='add-cause')openEditor(null);
  else if(a==='edit-cause')openEditor(id);
  else if(a==='print')window.print();
  else if(a==='go-inspect'){UI.tab='inspect';UI.open={};UI.open[id]=true;render();window.scrollTo(0,0)}
  else if(a==='toggle'){UI.open[id]=!UI.open[id];render()}
  else if(a==='open-all'){S.causes.forEach(function(c){UI.open[c.id]=true});render()}
  else if(a==='close-all'){UI.open={};render()}
  else if(a==='set'){
    var k=el.getAttribute('data-k'),v=el.getAttribute('data-v');var m=S.results[UI.target]=S.results[UI.target]||{};
    var cur=m[k]||{};if(cur.s===v){delete cur.s;delete cur.d}else{cur.s=v;cur.d=today()}
    if(!cur.s&&!cur.m)delete m[k];else m[k]=cur;changed();render();
  }
  else if(a==='ans'){var qa=S.scopeA[UI.target]=S.scopeA[UI.target]||{};var qid=el.getAttribute('data-q'),qv=el.getAttribute('data-v');if(qa[qid]===qv)delete qa[qid];else qa[qid]=qv;changed();render()}
  else if(a==='jump'){UI.target=el.getAttribute('data-t');UI.tab='inspect';UI.open={};UI.open[id]=true;render();window.scrollTo(0,0)}
  else if(a==='lacc'){UI.lacc=UI.lacc||{};UI.lacc[id]=(UI.lacc[id]===false);render()}
  else if(a==='cases-fetch'){casesFetch()}
  else if(a==='cases-enrich'){casesEnrich()}
  else if(a==='cases-cancel'){CS.cancel=true;casesSetMsg('中止しています…（処理中の1件が終わるまでお待ちください）')}
  else if(a==='gas-save'){var f=gasReadForm();if(!f.url&&!f.token){gasInfo('URLとトークンを入力してください');return}if(!gasValidUrl(f.url)){gasInfo('URLは https://script.google.com/…/exec の形式で入力してください');return}if(f.token.length<12){gasInfo('トークンは12文字以上にしてください');return}try{localStorage.removeItem(GAS_SKIP_LS)}catch(_){}gasInfo(gasSave(f)?'保存しました（再試行の記録もリセットしました）。「接続テスト」で確認できます':'保存できませんでした（このブラウザの保存領域が使えません）')}
  else if(a==='gas-test'){var g=gasReadForm();if(!gasValidUrl(g.url)||!g.token){gasInfo('URLとトークンを入力して「保存」してから試してください');return}gasInfo('接続を確認しています…');gasCall(g,{action:'ping'}).then(function(j){gasInfo('接続できました（GASバージョン '+j.version+'／AI整理：'+(j.ai?'使えます':'未設定のため紹介文のみ')+'／取得できるサイト：'+(j.hosts||[]).join(', ')+'）')}).catch(function(e){gasInfo('接続できませんでした：'+e.message)})}
  else if(a==='gas-reset-skip'){try{localStorage.removeItem(GAS_SKIP_LS)}catch(_){}gasInfo('次の「情報取得」で、失敗・紹介文のみの記事も再試行します')}
  else if(a==='gas-clear'){try{localStorage.removeItem(GAS_LS);localStorage.removeItem(GAS_SKIP_LS)}catch(_){}gasInfo('設定を消しました');render()}
  else if(a==='cases-reload'){casesReload(false)}
  else if(a==='add-target'){var inp=document.getElementById('newTarget');var n=inp.value.trim();if(!n)return;if(S.targets.find(function(t){return t.name===n})){notify('同じ名前の取引先があります',true);return}S.targets.push({name:n,inScope:true});changed();render()}
  else if(a==='del-target'){var i=+el.getAttribute('data-i');var t=S.targets[i];askConfirm('「'+t.name+'」と、その点検結果を削除します。よろしいですか？',function(){S.targets.splice(i,1);delete S.results[t.name];delete S.off[t.name];delete S.scopeA[t.name];if(UI.target===t.name)UI.target=S.targets[0]&&S.targets[0].name;changed();render()})}
  else if(a==='export-json')saveFile('情報漏洩対策集_'+today()+'.json',JSON.stringify(S,null,2),'application/json');
  else if(a==='export-csv')saveFile('点検結果_'+today()+'.csv',csv(),'text/csv');
  else if(a==='show-json'){var box=document.getElementById('pasteBox');box.value=JSON.stringify(S);box.focus();box.select();var ok=false;try{ok=document.execCommand('copy')}catch(_){}notify(ok?'JSONをコピーしました':'JSONを欄に表示しました。選択してコピーしてください')}
  else if(a==='paste-replace'||a==='paste-merge'){
    var raw=(document.getElementById('pasteBox').value||'').trim();
    if(!raw){notify('JSONを貼り付けてください',true);return}
    var d;try{d=JSON.parse(raw);if(!d||!Array.isArray(d.causes)||!Array.isArray(d.targets))throw new Error('情報漏洩対策集のJSONではありません')}catch(err){notify('読み込めませんでした：'+(err instanceof SyntaxError?'JSONとして読み取れません':err.message),true);return}
    if(a==='paste-replace'){askConfirm('いまの内容を、貼り付けたJSONで置き換えます。よろしいですか？',function(){S=normalizeS(d);fixUI();changed();render();notify('読み込みました')})}
    else{mergeImport(d);changed();render();notify('読み込みました')}
  }
  else if(a==='reset-results'){askConfirm('全取引先の点検結果を消します。よろしいですか？',function(){S.results={};changed();render()})}
  else if(a==='save-now'){XL.loadFailed=false;xlSave()}
  else if(a==='reload-xl'){askConfirm('Excelに保存されている内容で、いまの画面を置き換えます。保存前の変更は失われます。よろしいですか？',function(){bootExcel()})}
  else if(a==='update-reports'){XL.loadFailed=false;xlSave().then(function(){return xlReports(true)})}
});
root.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='target'){UI.target=t.value;render()}
  else if(t.id==='scope'){var x=S.targets.find(function(y){return y.name===UI.target});x.inScope=t.checked;changed();render()}
  else if(t.hasAttribute('data-cscope')){var cid=t.getAttribute('data-cscope');var o=S.off[UI.target]=S.off[UI.target]||{};if(t.checked)delete o[cid];else{o[cid]='';UI.open[cid]=true}changed();render()}
  else if(t.hasAttribute('data-offr')){var o2=S.off[UI.target]=S.off[UI.target]||{};o2[t.getAttribute('data-offr')]=t.value.trim();changed()}
  else if(t.hasAttribute('data-scope')){S.targets[+t.getAttribute('data-scope')].inScope=t.checked;changed()}
  else if(t.hasAttribute('data-memo')){var k=t.getAttribute('data-memo');var m=S.results[UI.target]=S.results[UI.target]||{};var cur=m[k]||{};cur.m=t.value.trim();if(!cur.s&&!cur.m)delete m[k];else m[k]=cur;changed()}
  else if(t.hasAttribute('data-startup')){xlSetStartup(t.checked)}
  else if(t.hasAttribute('data-auto')){S.settings=S.settings||{};S.settings.autoReport=t.checked;changed()}
  else if(t.id==='importFile'&&t.files[0]){var f=new FileReader();f.onload=function(){try{mergeImport(JSON.parse(f.result));changed();render();notify('読み込みました')}catch(err){notify('読み込めませんでした：'+err.message,true)}};f.readAsText(t.files[0])}
});
root.addEventListener('input',function(e){
  if(e.target.id==='q'){UI.q=e.target.value;var pos=e.target.selectionStart;render();var q=document.getElementById('q');q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}}
});
root.addEventListener('keydown',function(e){if(e.target.id==='newTarget'&&e.key==='Enter'){e.preventDefault();var b=root.querySelector('[data-act="add-target"]');if(b)b.click()}});

/* ---------- 起動 ---------- */
function fixUI(){
  if(!cause(UI.cause))UI.cause=S.causes[0]&&S.causes[0].id;
  if(!S.targets.find(function(t){return t.name===UI.target})){var f=S.targets.find(function(t){return t.inScope});UI.target=f?f.name:(S.targets[0]&&S.targets[0].name)}
}
function normalizeS(d){
  if(!d||!Array.isArray(d.causes)||!Array.isArray(d.targets))throw new Error('情報漏洩対策集のデータではありません');
  d.results=d.results||{};d.off=d.off||{};d.scopeA=d.scopeA||{};d.settings=d.settings||{};
  d.freqs=d.freqs||['月次','四半期','半期','年次','作業ごと','変更時'];
  d.updated=d.updated||new Date().toISOString();
  d.causes.forEach(function(c){
    c.checks=c.checks||[];c.reasons=c.reasons||[];c.measures=c.measures||{};c.refs=c.refs||[];c.history=c.history||[];
    if(!c.scopeQs)c.scopeQs=(DEFQ[c.id]||[]).map(function(t,i){return{id:c.id+'-q'+(i+1),text:t}});
  });
  return migrate(d);
}
function bootBrowser(){
  try{var local=JSON.parse(localStorage.getItem(LS_KEY)||'null');if(local&&Array.isArray(local.causes)&&local.updated>S.updated)S=normalizeS(local)}catch(e){}
  fixUI();render();
}
function bootExcel(){
  IN_EXCEL=true;XL.loadFailed=false;saveState='Excelから読み込み中…';render();
  xlStartupInit();
  return xlLoad().then(function(d){
    if(d){var was=d.version||1;S=normalizeS(d);saveState='Excelから読み込みました（'+hhmm()+'）';if(was<SEED_VERSION)setTimeout(changed,0)}
    else saveState='このブックにはまだ保存されていません。変更すると自動で保存されます。';
    fixUI();render();
  }).catch(function(err){
    XL.loadFailed=true;saveState='Excelから読み込めませんでした：'+(err&&err.message?err.message:err);render();notify(saveState,true);
  });
}
/* 共有ランタイム：ブックを開いたときに自動で起動・表示する設定 */
function xlStartupInit(){
  try{
    if(Office.addin&&Office.addin.getStartupBehavior){
      Office.addin.getStartupBehavior().then(function(b){
        XL.startup=(b===Office.StartupBehavior.load);
        if(XL.startup&&Office.addin.showAsTaskpane)return Office.addin.showAsTaskpane();
      }).then(function(){if(UI.tab==='data'&&!document.activeElement.id)render()}).catch(function(){});
    }
  }catch(e){}
}
function xlSetStartup(on){
  if(!(typeof Office!=='undefined'&&Office.addin&&Office.addin.setStartupBehavior)){notify('この環境では自動起動の設定ができません',true);XL.startup=false;render();return}
  Office.addin.setStartupBehavior(on?Office.StartupBehavior.load:Office.StartupBehavior.none).then(function(){
    XL.startup=on;notify(on?'次回からブックを開くと、自動でこの画面が開きます':'自動で開く設定を解除しました');
  }).catch(function(e){notify('設定できませんでした：'+(e&&e.message?e.message:e),true);XL.startup=!on;render()});
}
var booted=false;
function boot(excel){if(booted)return;booted=true;if(excel)bootExcel();else bootBrowser()}
var HOSTHINT=/[?&]_host_Info=Excel/i.test((typeof location!=='undefined'&&location.search)||'');
if(typeof Office!=='undefined'&&Office.onReady){
  Office.onReady(function(info){boot(!!(info&&Office.HostType&&info.host===Office.HostType.Excel))});
  if(!HOSTHINT)setTimeout(function(){boot(false)},3000);
}else boot(false);
})();
