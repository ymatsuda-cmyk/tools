# 情報漏洩事例フィード（addin/security/cases-feed.json）を毎日自動で更新する。
# このファイルは、リポジトリの  .github/workflows/fetch-cases.yml  に置く。
name: 情報漏洩事例フィードの更新

on:
  schedule:
    - cron: '0 22 * * *'   # 毎日 07:00（日本時間）
  workflow_dispatch:        # 画面から手動でも実行できる（Actions › この名前 › Run workflow）

permissions:
  contents: write           # cases-feed.json をコミットするため
  pages: write              # 更新後に GitHub Pages の再公開を依頼するため

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 新着事例を取得し、元記事から詳細を整理
        env:
          # 任意：設定すると、元記事の本文を読んで7項目（概要・発覚の経緯・リスク・原因・対処・導入業者としての対策）を整理する。
          # 未設定のときは、記事の紹介文（短い）だけを概要に入れる。
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # ANTHROPIC_MODEL: claude-sonnet-5-5      # 使うモデルを変えるとき
        run: >
          python addin/security/automation/fetch_cases.py
          --feed addin/security/cases-feed.json
          --sources addin/security/automation/sources.json
          --enrich-limit 8

      - name: 変更があればコミット
        id: commit
        run: |
          if [ -n "$(git status --porcelain addin/security/cases-feed.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add addin/security/cases-feed.json
            git commit -m "情報漏洩事例フィードを更新"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: GitHub Pages の再公開を依頼（失敗しても続行）
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
